name: Release

on:
  push:
    tags:
      - '[0-9][0-9].[0-9][0-9].[0-9][0-9]'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17
          cache: gradle
      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@master
      - name: Retrieve version
        run: |
          APP_VER_NAME=$(grep '^appVerName=' gradle.properties | cut -d'=' -f2)
          if [ "${{ github.event_name }}" = "push" ] && [ "${GITHUB_REF_NAME}" != "${APP_VER_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match appVerName=${APP_VER_NAME} in gradle.properties"
            exit 1
          fi
          echo VERSION=${APP_VER_NAME} >> $GITHUB_ENV
      - name: Write key
        run: |
          if [ -n "${{ secrets.KEY_STORE }}" ]; then
            echo releaseStorePassword='${{ secrets.KEY_STORE_PASSWORD }}' >> gradle.properties
            echo releaseKeyAlias='${{ secrets.ALIAS }}' >> gradle.properties
            echo releaseKeyPassword='${{ secrets.KEY_PASSWORD }}' >> gradle.properties
            echo releaseStoreFile='${{ github.workspace }}/key.jks' >> gradle.properties
            echo ${{ secrets.KEY_STORE }} | base64 --decode > key.jks
          else
            echo "::warning::KEY_STORE is not configured, the release APK will be signed with the debug key"
          fi
      - name: Test compatibility resolvers
        run: bash ./gradlew testDebugUnitTest
      - name: Build with Gradle
        run: bash ./gradlew -PappVerName=${{ env.VERSION }} assembleRelease
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="app/build/outputs/apk/release/Zhiliao_${VERSION}.apk"
          ls -l "${APK}"
          if gh release view "${VERSION}" > /dev/null 2>&1; then
            gh release upload "${VERSION}" "${APK}" --clobber
          else
            gh release create "${VERSION}" "${APK}" \
              --title "${VERSION}" \
              --target "${GITHUB_SHA}" \
              --generate-notes
          fi
      - name: Upload built apk
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Zhiliao_${{ env.VERSION }}
          path: ${{ github.workspace }}/app/build/outputs/apk/release
